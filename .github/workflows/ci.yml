name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Die WPF-Anwendung zielt auf net10.0-windows; die Projektmappe baut
    # deshalb nur unter Windows vollständig.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VolvoSplitter.slnx

      - name: Build
        run: dotnet build VolvoSplitter.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test VolvoSplitter.Core.Tests/VolvoSplitter.Core.Tests.csproj
          -c Release --no-build --verbosity normal
